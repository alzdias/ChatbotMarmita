<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Execução da Suíte de Testes - Marmitaria Sabor & Arte</title>
  <style>
    body { font-family: monospace; background: #0f172a; color: #e2e8f0; padding: 24px; line-height: 1.6; }
    h1 { color: #f97316; font-size: 1.4rem; }
    #console-output { background: #1e293b; padding: 16px; border-radius: 8px; border: 1px solid #334155; white-space: pre-wrap; max-height: 80vh; overflow-y: auto; }
    .pass { color: #4ade80; }
    .fail { color: #f87171; font-weight: bold; }
    .summary { color: #38bdf8; font-size: 1.1rem; margin-top: 12px; font-weight: bold; }
    .btn-return { display: inline-block; margin-top: 16px; padding: 10px 18px; background: #ea580c; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; }
  </style>
</head>
<body>
  <h1>🧪 Marmitaria Sabor &amp; Arte — Validador de Requisitos e Cenários</h1>
  <div id="console-output">Executando suíte de testes determinísticos...</div>
  <a href="index.html" class="btn-return">← Voltar ao Chatbot</a>

  <script type="module">
    const outputEl = document.getElementById("console-output");
    const originalLog = console.log;
    const originalError = console.error;

    outputEl.innerHTML = "";

    function logToScreen(msg, isError = false) {
      const line = document.createElement("div");
      if (isError) line.className = "fail";
      else if (msg.includes("✅")) line.className = "pass";
      else if (msg.includes("📊")) line.className = "summary";
      line.textContent = msg;
      outputEl.appendChild(line);
    }

    console.log = function(...args) {
      originalLog.apply(console, args);
      logToScreen(args.join(" "));
    };

    console.error = function(...args) {
      originalError.apply(console, args);
      logToScreen(args.join(" "), true);
    };

    import("./test-suite.js").then(module => {
      // Automaticamente invocado pelo módulo
    }).catch(err => {
      console.error("Erro ao carregar suíte:", err);
    });
  </script>
</body>
</html>
